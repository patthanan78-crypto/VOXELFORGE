[package]
name = "voxelforge-rust-launcher"
version = "0.26.3"
edition = "2024"
description = "High-performance Minecraft Rust Launcher for Windows and Android (Mojang Manifest 1.0 - 1.26.3)"
license = "Apache-2.0"

[lib]
name = "voxelforge_launcher"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "voxelforge-windows"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.31"
wgpu = "24.0"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha1 = "0.10"
md-5 = "0.10"
directories = "6.0"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
winit = { version = "0.30", features = ["android-native-activity"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
